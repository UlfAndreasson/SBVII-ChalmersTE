name: Apply v8.1 migration

on:
  push:
    branches:
      - main
    paths:
      - 'tools/apply_v8_1.py'
      - '.github/workflows/apply-v8-1.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v8.1 migration
        run: python tools/apply_v8_1.py

      - name: Syntax check Apps Script
        run: |
          cp appscript.gs /tmp/appscript.js
          node --check /tmp/appscript.js

      - name: Commit migrated source
        run: |
          if git diff --quiet -- appscript.gs README.md; then
            echo 'No migration changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appscript.gs README.md
          git commit -m 'Apply v8.1 manual color preservation'
          git push
